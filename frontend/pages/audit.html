
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit Log | AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="crm-dashboard">

<nav class="navbar crm-navbar px-4 py-3">
    <div class="container-fluid">
        <h4 class="mb-0">AcxiomCRM</h4>
        <div>
            <span id="userRole" class="me-3"></span>
            <button class="btn logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
    <div class="mb-4">
        <h3>Audit Log</h3>
        <p class="text-muted mb-0">Monitor actions performed across the CRM</p>
    </div>

    <div class="dashboard-card mb-4">
        <input id="searchAudit" class="form-control"
               placeholder="Search by username, action or entity...">
    </div>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Action</th>
                        <th>Entity</th>
                        <th>Record ID</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="auditTable">
                    <tr><td colspan="5" class="text-center">Loading audit records...</td></tr>
                </tbody>
            </table>
        </div>
        <p id="message" class="mt-3"></p>
    </div>

    <a href="/dashboard" class="btn btn-outline-secondary mt-3">← Dashboard</a>
</div>

<script src="/static/js/audit.js"></script>
</body>
</html>
