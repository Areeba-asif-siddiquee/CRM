
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | AcxiomCRM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="crm-dashboard">

<nav class="navbar crm-navbar px-4 py-3">
    <div class="container-fluid">
        <h4 class="mb-0">AcxiomCRM</h4>
        <div>
            <span id="userRole" class="me-3"></span>
            <button class="btn logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h3>Customers</h3>
            <p class="text-muted mb-0">Manage your customer records</p>
        </div>

        <button class="btn logout-btn" data-bs-toggle="modal" data-bs-target="#customerModal"
                onclick="prepareAddCustomer()">
            + Add Customer
        </button>
    </div>

    <div class="dashboard-card mb-4">
        <input type="text" id="searchCustomer" class="form-control"
               placeholder="Search by name, email, phone or company...">
    </div>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="customerTable">
                    <tr><td colspan="6" class="text-center">Loading customers...</td></tr>
                </tbody>
            </table>
        </div>
        <p id="message" class="mt-3 mb-0"></p>
    </div>

    <a href="/dashboard" class="btn btn-outline-secondary mt-3">← Back to Dashboard</a>
</div>

<!-- Add/Edit Customer Modal -->
<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="customerForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Customer</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="customerId">

                    <div class="mb-3">
                        <label class="form-label">Customer Name *</label>
                        <input type="text" id="customerName" class="form-control" required maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" id="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone *</label>
                        <input type="tel" id="phone" class="form-control" required pattern="[6-9][0-9]{9}" maxlength="10">
                        <small class="text-muted">Enter a valid 10-digit Indian mobile number.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <input type="text" id="companyName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" id="address" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">City</label>
                        <input type="text" id="city" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">State</label>
                        <input type="text" id="state" class="form-control">
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn logout-btn">Save Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/customers.js"></script>
</body>
</html>
