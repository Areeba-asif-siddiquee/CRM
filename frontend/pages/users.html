
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | AcxiomCRM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">

    <style>
        body {
            background: #F3EDE2;
            color: #554637;
        }

        .main-container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .content-card {
            background: #FFFEFA;
            border: 1px solid #DED5C8;
            border-radius: 12px;
            padding: 25px;
        }

        .btn-brown {
            background: #76624D;
            color: white;
            border: none;
        }

        .btn-brown:hover {
            background: #554637;
            color: white;
        }

        .table {
            color: #554637;
            vertical-align: middle;
        }

        .table thead th {
            background: #F3EDE2;
            color: #554637;
            border-bottom: 1px solid #DED5C8;
        }

        .form-control, .form-select {
            border-color: #DED5C8;
        }

        .form-control:focus, .form-select:focus {
            border-color: #76624D;
            box-shadow: 0 0 0 0.15rem rgba(118, 98, 77, 0.15);
        }

        .status-active {
            background: #E4EFE5;
            color: #386641;
        }

        .status-inactive {
            background: #F5E4E0;
            color: #9B4035;
        }

        .page-title {
            font-weight: 700;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg" style="background:#FFFEFA; border-bottom:1px solid #DED5C8;">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="/dashboard" style="color:#76624D;">
            AcxiomCRM
        </a>

        <div class="d-flex align-items-center gap-3">
            <span id="adminName" class="text-muted"></span>
            <a href="/dashboard" class="btn btn-outline-secondary btn-sm">Dashboard</a>
            <button id="logoutBtn" class="btn btn-brown btn-sm">Logout</button>
        </div>
    </div>
</nav>

<div class="main-container">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="page-title">User Management</h2>
            <p class="text-muted mb-0">Create and manage system users and their roles.</p>
        </div>

        <button class="btn btn-brown" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openAddModal()">
            + Add New User
        </button>
    </div>

    <div id="messageBox" class="alert d-none"></div>

    <div class="content-card">

        <div class="row mb-3">
            <div class="col-md-5">
                <input type="text" id="searchUser" class="form-control"
                       placeholder="Search by username or name...">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="6" class="text-center">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<!-- Add/Edit User Modal -->
<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="background:#FFFEFA;">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add New User</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="userForm">

                    <input type="hidden" id="userId">

                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" id="username" class="form-control"
                               minlength="3" maxlength="30" required>
                    </div>

                    <div class="mb-3" id="passwordGroup">
                        <label class="form-label">Password *</label>
                        <input type="password" id="password" class="form-control"
                               minlength="6" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="fullName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Role *</label>
                        <select id="userRole" class="form-select" required>
                            <option value="Admin">Admin</option>
                            <option value="Manager">Manager</option>
                            <option value="SalesExecutive">Sales Executive</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="statusGroup">
                        <label class="form-label">Account Status</label>
                        <select id="userStatus" class="form-select">
                            <option value="true">Active</option>
                            <option value="false">Inactive</option>
                        </select>
                    </div>

                    <div id="formError" class="text-danger small mb-2"></div>

                    <button type="submit" class="btn btn-brown w-100">
                        Save User
                    </button>

                </form>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/users.js"></script>

</body>
</html>
