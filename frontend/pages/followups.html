
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Follow-Ups | AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="crm-dashboard">

<nav class="navbar crm-navbar px-4 py-3">
    <div class="container-fluid">
        <h4 class="mb-0">AcxiomCRM</h4>
        <div>
            <span id="userRole" class="me-3"></span>
            <button class="btn logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h3>Follow-Ups</h3>
            <p class="text-muted mb-0">Schedule and track customer interactions</p>
        </div>
        <button class="btn logout-btn" data-bs-toggle="modal"
                data-bs-target="#followupModal" onclick="prepareAddFollowup()">
            + Add Follow-Up
        </button>
    </div>

    <div class="dashboard-card mb-4">
        <input id="searchFollowup" class="form-control"
               placeholder="Search by subject, customer ID or type...">
    </div>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Customer ID</th>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Remarks</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="followupTable">
                    <tr><td colspan="7" class="text-center">Loading follow-ups...</td></tr>
                </tbody>
            </table>
        </div>
        <p id="message" class="mt-3"></p>
    </div>

    <a href="/dashboard" class="btn btn-outline-secondary mt-3">← Dashboard</a>
</div>

<div class="modal fade" id="followupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="followupForm">
                <div class="modal-header">
                    <h5 id="modalTitle">Add Follow-Up</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="followupId">

                    <div class="mb-3">
                        <label class="form-label">Customer ID *</label>
                        <input id="customerId" class="form-control" required
                               placeholder="Paste customer MongoDB ID">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject *</label>
                        <input id="subject" class="form-control" required maxlength="150">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Follow-Up Date *</label>
                        <input id="followupDate" type="datetime-local" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select id="followupType" class="form-select">
                            <option value="Call">Call</option>
                            <option value="Meeting">Meeting</option>
                            <option value="Email">Email</option>
                            <option value="Task">Task</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option value="Planned">Planned</option>
                            <option value="Completed">Completed</option>
                            <option value="Missed">Missed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Remarks</label>
                        <textarea id="remarks" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn logout-btn">Save Follow-Up</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/followups.js"></script>
</body>
</html>
