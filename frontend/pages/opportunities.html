
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opportunities | AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body class="crm-dashboard">

<nav class="navbar crm-navbar px-4 py-3">
    <div class="container-fluid">
        <h4 class="mb-0">AcxiomCRM</h4>
        <div>
            <span id="userRole" class="me-3"></span>
            <button class="btn logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h3>Opportunities</h3>
            <p class="text-muted mb-0">Track and manage potential sales deals</p>
        </div>

        <button class="btn logout-btn" data-bs-toggle="modal"
                data-bs-target="#opportunityModal" onclick="prepareAddOpportunity()">
            + Add Opportunity
        </button>
    </div>

    <div class="dashboard-card mb-4">
        <input id="searchOpportunity" class="form-control"
               placeholder="Search by opportunity name or stage...">
    </div>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Opportunity</th>
                        <th>Customer ID</th>
                        <th>Amount</th>
                        <th>Stage</th>
                        <th>Probability</th>
                        <th>Weighted Value</th>
                        <th>Expected Close</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="opportunityTable">
                    <tr><td colspan="8" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        <p id="message" class="mt-3"></p>
    </div>

    <a href="/dashboard" class="btn btn-outline-secondary mt-3">← Dashboard</a>
</div>

<div class="modal fade" id="opportunityModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="opportunityForm">

                <div class="modal-header">
                    <h5 id="modalTitle">Add Opportunity</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="opportunityId">

                    <div class="mb-3">
                        <label class="form-label">Opportunity Name *</label>
                        <input id="opportunityName" class="form-control" required maxlength="150">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Customer ID *</label>
                        <input id="customerId" class="form-control" required
                               placeholder="Paste the customer MongoDB ID">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Amount (₹) *</label>
                        <input id="amount" type="number" min="0.01" step="0.01"
                               class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Stage</label>
                        <select id="stage" class="form-select">
                            <option>Qualification</option>
                            <option>Proposal</option>
                            <option>Negotiation</option>
                            <option>Won</option>
                            <option>Lost</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Probability (%)</label>
                        <input id="probability" type="number" min="0" max="100"
                               class="form-control" value="50" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Expected Close Date *</label>
                        <input id="expectedCloseDate" type="date" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea id="notes" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn logout-btn">Save Opportunity</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/opportunities.js"></script>

</body>
</html>
