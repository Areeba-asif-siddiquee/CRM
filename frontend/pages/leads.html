
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Leads | AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="crm-dashboard">

<nav class="navbar crm-navbar px-4 py-3">
    <div class="container-fluid">
        <h4 class="mb-0">AcxiomCRM</h4>
        <div>
            <span id="userRole" class="me-3"></span>
            <button class="btn logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3>Leads Management</h3>
            <p class="text-muted mb-0">Manage and track potential customers</p>
        </div>
        <button class="btn logout-btn" onclick="prepareAddLead()"
                data-bs-toggle="modal" data-bs-target="#leadModal">
            + Add Lead
        </button>
    </div>

    <div class="dashboard-card mb-4">
        <input id="searchLead" class="form-control"
               placeholder="Search leads by name, email or company...">
    </div>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Source</th>
                        <th>Status</th>
                        <th>Expected Value</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="leadTable">
                    <tr><td colspan="8" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        <p id="message" class="mt-3"></p>
    </div>

    <a href="/dashboard" class="btn btn-outline-secondary mt-3">← Dashboard</a>
</div>

<div class="modal fade" id="leadModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="leadForm">
                <div class="modal-header">
                    <h5 id="modalTitle">Add Lead</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="leadId">

                    <div class="mb-3">
                        <label class="form-label">Lead Name *</label>
                        <input id="leadName" class="form-control" required maxlength="100">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input id="email" type="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input id="phone" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company</label>
                        <input id="companyName" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Lead Source</label>
                        <select id="source" class="form-select">
                            <option value="Website">Website</option>
                            <option value="Referral">Referral</option>
                            <option value="Social Media">Social Media</option>
                            <option value="Advertisement">Advertisement</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option>New</option>
                            <option>Contacted</option>
                            <option>Qualified</option>
                            <option>Unqualified</option>
                            <option>Converted</option>
                            <option>Lost</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Expected Value (₹)</label>
                        <input id="expectedValue" type="number" min="0" class="form-control" value="0">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea id="notes" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn logout-btn">Save Lead</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/leads.js"></script>
</body>
</html>
