
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Activities | AcxiomCRM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="crm-dashboard">

<nav class="navbar crm-navbar px-4 py-3">
    <div class="container-fluid">
        <h4 class="mb-0">AcxiomCRM</h4>
        <div>
            <span id="userRole" class="me-3"></span>
            <button class="btn logout-btn" id="logoutBtn">Logout</button>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h3>Activities</h3>
            <p class="text-muted mb-0">Record and track calls, meetings, emails and tasks</p>
        </div>
        <button class="btn logout-btn" data-bs-toggle="modal"
                data-bs-target="#activityModal" onclick="prepareAddActivity()">
            + Add Activity
        </button>
    </div>

    <div class="dashboard-card mb-4">
        <input id="searchActivity" class="form-control"
               placeholder="Search by subject, type or description...">
    </div>

    <div class="dashboard-card">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Subject</th>
                        <th>Type</th>
                        <th>Date</th>
                        <th>Customer ID</th>
                        <th>Lead ID</th>
                        <th>Status</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="activityTable">
                    <tr><td colspan="8" class="text-center">Loading activities...</td></tr>
                </tbody>
            </table>
        </div>
        <p id="message" class="mt-3"></p>
    </div>

    <a href="/dashboard" class="btn btn-outline-secondary mt-3">← Dashboard</a>
</div>

<div class="modal fade" id="activityModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="activityForm">
                <div class="modal-header">
                    <h5 id="modalTitle">Add Activity</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="activityId">

                    <div class="mb-3">
                        <label class="form-label">Subject *</label>
                        <input id="subject" class="form-control" required maxlength="150">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Activity Type *</label>
                        <select id="activityType" class="form-select" required>
                            <option value="Call">Call</option>
                            <option value="Meeting">Meeting</option>
                            <option value="Email">Email</option>
                            <option value="Task">Task</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Activity Date *</label>
                        <input id="activityDate" type="datetime-local" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Customer ID</label>
                        <input id="customerId" class="form-control"
                               placeholder="Enter customer MongoDB ID">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Lead ID</label>
                        <input id="leadId" class="form-control"
                               placeholder="Enter lead MongoDB ID">
                    </div>

                    <small class="text-muted">Provide at least one: Customer ID or Lead ID.</small>

                    <div class="mb-3 mt-3">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option value="Planned">Planned</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea id="description" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn logout-btn">Save Activity</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/activities.js"></script>
</body>
</html>
